    <script>
      // Apply the saved theme before first paint to avoid a flash. Mirrors
      // applyTheme in src/hooks/useTheme.ts (the value is JSON in localStorage).
      try {
        var saved = JSON.parse(localStorage.getItem('theme') || '"system"')
        var dark =
          saved === 'dark' ||
          (saved !== 'light' &&
            matchMedia('(prefers-color-scheme: dark)').matches)
        var root = document.documentElement
        root.classList.toggle('dark', dark)
        root.style.colorScheme = dark ? 'dark' : 'light'
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', dark ? '#000000' : '#f2f2f7')
      } catch (e) {}
