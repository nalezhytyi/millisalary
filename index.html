    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f2f7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      // Apply the saved theme before first paint to avoid a flash. Mirrors
      // applyTheme in src/hooks/useTheme.ts (the value is JSON in localStorage).
      try {
        var saved = JSON.parse(localStorage.getItem('theme') || '"system"')
        var dark =
          saved === 'dark' ||
          (saved !== 'light' &&
            matchMedia('(prefers-color-scheme: dark)').matches)
        var root = document.documentElement
        root.classList.toggle('dark', dark)
        root.style.colorScheme = dark ? 'dark' : 'light'
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', dark ? '#000000' : '#f2f2f7')
      } catch (e) {}
    </script>
    <script>
      // iOS home-screen web apps size the layout viewport short of the real
      // screen (see .ios-standalone rules in index.css). navigator.standalone
      // is iOS-WebKit-only and true exactly in that mode.
      if (navigator.standalone) {
        document.documentElement.classList.add('ios-standalone')
      }
      // Cleared by src/splash.ts when the splash is removed
      document.documentElement.classList.add('splash-active')
    </script>
    <style>
      /* Splash: painted from the first frame, before any JS. Background mirrors
         --background in index.css (and THEME_COLORS in useTheme.ts); the theme
         script above has already toggled html.dark. Removed by src/splash.ts. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f2f2f7;
      }
      html.dark #splash {
        background: #000000;
      }
      #splash img {
        width: 96px;
        height: 96px;
        object-fit: contain;
        user-select: none;
        -webkit-user-drag: none;
      }
      html.splash-active,
      html.splash-active body {
        overflow: hidden;
      }
    </style>
    <title>Millisalary</title>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <picture>
        <source
          srcset="images/money-face.png"
          media="(prefers-reduced-motion: reduce)"
        />
        <img src="images/money-face.webp" alt="" draggable="false" />
      </picture>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
